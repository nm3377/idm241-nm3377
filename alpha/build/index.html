<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDM 241 Alpha Build</title>
  <link rel="stylesheet" href="assets/styles/normalize.css" />
  <link rel="stylesheet" href="assets/styles/main.css" />
</head>

<body>

  <main>
    <h1>YouTube Dislike Button Microinteraction</h1>

    <div class="dislike-container">

      <input
        type="checkbox"
        id="dislike"
        class="dislike-checkbox"
      />

      <label for="dislike" class="dislike-button">

        <img
          class="thumb thumb-outline"
          src="assets/images/outline_thumb.png"
          alt="An outline of a thumbs down icon"
        />

        <img
          class="thumb thumb-filled"
          src="assets/images/full_thumb.png"
          alt="A fully filled thumbs down icon"
        />

        <span class="tooltip">I dislike this</span>

      </label>

    </div>
  </main>

</body>
</html>
